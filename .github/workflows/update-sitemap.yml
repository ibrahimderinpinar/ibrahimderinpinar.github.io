name: Update sitemap and search index

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "*.html"
      - "scripts/generate_sitemap.py"
      - "scripts/generate_search_index.py"
      - ".github/workflows/update-sitemap.yml"

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py

      - name: Generate search index
        run: python3 scripts/generate_search_index.py

      - name: Commit metadata changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sitemap and search index"
          file_pattern: sitemap.xml search-index.json
