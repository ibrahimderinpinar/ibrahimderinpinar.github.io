<script type="application/ld+json">{
 "@context": "https://schema.org",
 "@type": "FAQPage",
 "mainEntity": [
 {
 "@type": "Question",
 "name": "Yönetim kurulu yönetim yetkisini iç yönerge olmadan devredebilir mi?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Hayır. TTK m. 367/1 uyarınca yönetim yetkisinin devredilebilmesi için hem esas sözleşmede açık yetki bulunması hem de yönetim kurulunca tescil ve ilan edilecek bir iç yönergenin çıkarılması zorunludur. Fiili yetki devri Yargıtay içtihatlarında kesin olarak geçersiz sayılmaktadır."
 }
 },
 {
 "@type": "Question",
 "name": "Yönetim kurulu bütün yetkilerini müdürlere veya murahhaslara devredebilir mi?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Hayır. TTK m. 375'te tahdidi olarak düzenlenen üst düzey yönetim, teşkilat belirleme, muhasebe/finans denetimi ve üst gözetim gibi görevler vazgeçilemez ve devredilemez çekirdek yetkilerdir; iç yönergeyle dahi devredilemez. Aksi yöndeki düzenlemeler TTK m. 391/1-a uyarınca batıldır."
 }
 },
 {
 "@type": "Question",
 "name": "Murahhas üye ile murahhas müdür arasındaki temel fark nedir?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Murahhas üye, yönetim kurulu üyesi olup aynı zamanda yönetim yetkisiyle donatılan kişidir; organ sıfatını taşır ve kurul toplantılarında oy kullanır. Murahhas müdür ise yönetim kurulu üyesi olmayan, şirkete iş sözleşmesiyle bağlı profesyonel bir üçüncü kişidir (Genel Müdür / CEO); kurul toplantılarında oy hakkı bulunmaz."
 }
 },
 {
 "@type": "Question",
 "name": "Yetki devri yönetim kurulu üyelerini sorumluluktan bütünüyle kurtarır mı?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "TTK m. 553/2 gereğince yetkiyi usulüne uygun devreden kurul üyeleri, devralan kişilerin seçiminde makul özeni göstermiş olmaları kaydıyla bu kişilerin fiil ve kararlarından sorumlu olmazlar. Ancak kurulun doğru talimat verme (cura in instruendo) ve üst gözetim (cura in custodiendo) sorumlulukları devam eder."
 }
 },
 {
 "@type": "Question",
 "name": "İç yönergenin ticaret siciline tescil ve ilanı zorunlu mudur?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Evet. TTK m. 367/1 ve Ticaret Sicili Yönetmeliği m. 73 uyarınca iç yönerge yönetim kurulunca hazırlanır, ticaret siciline tescil ve ilan ettirilir. Tescil ve ilan edilmemiş iç yönergeye dayanan yetki devri üçüncü kişilere karşı ileri sürülemez."
 }
 },
 {
 "@type": "Question",
 "name": "Yönetim yetkisinin devri temsil yetkisini de kendiliğinden devreder mi?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Hayır. Yönetim yetkisi iç ilişkiye (şirketin idaresine), temsil yetkisi ise dış ilişkiye (şirket adına hukuki işlem yapmaya) ilişkindir. Temsil yetkisinin devri TTK m. 370/2 kapsamında ayrıca yönetim kurulu kararıyla kararlaştırılmalı ve tescil/ilan edilmelidir."
 }
 },
 {
 "@type": "Question",
 "name": "Murahhas üyeler veya müdürler yönetim kurulunca görevden alınabilir mi?",
 "acceptedAnswer": {
 "@type": "Answer",
 "text": "Evet. TTK m. 375/1-d uyarınca müdürleri ve murahhasları atama ve görevden alma yetkisi yönetim kurulunun devredilemez yetkisidir. Yönetim kurulu dilediği zaman haklı neden olmasa dahi murahhasları görevden alabilir; ancak haksız azil hâlinde sözleşmesel tazminat talepleri saklı kalır."
 }
 }
 ]
